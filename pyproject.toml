[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openagentontology"
version = "0.2.0"
description = "Auto-generate a governance ontology, Trust Profile, and signed badge for any agent, MCP server, repo, OpenAPI, Rego, or workflow. The OpenTelemetry for agent governance."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Cyber Warrior Network", email = "apps@cyberwarriornetwork.com" }]
keywords = [
    "ai-governance",
    "agent",
    "ontology",
    "compliance",
    "eu-ai-act",
    "nist-800-53",
    "owasp-llm",
    "mcp",
    "trust",
    "ed25519",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

# stdlib + pyyaml + cryptography ONLY. cryptography is a hard dep for the signed
# receipt; the package still imports and runs (unsigned, clearly flagged) without it.
dependencies = [
    "pyyaml>=6.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
# `pip install .[dev]` for the test suite. Tests themselves only need pytest + the two
# runtime deps already declared above; nothing heavier.
dev = ["pytest>=7.0"]
# `pip install "openagentontology[mcp]"` to run the MCP server (oao_scan_agent etc.).
mcp = ["mcp>=1.2.0"]
# `pip install "openagentontology[pq]"` turns on the post-quantum receipt legs: ML-DSA-65
# (FIPS 204) via the pure-Python dilithium_py. The SLH-DSA leg (FIPS 205) additionally needs
# liboqs-python, which ships a native lib -- install it explicitly when you want all three.
# Without this extra the receipt stays Ed25519-only and still verifies everywhere.
pq = ["dilithium-py>=1.0"]

[project.urls]
Homepage = "https://agent-ontology.cyberwarriornetwork.com"
Repository = "https://github.com/CWNApps/openagentontology"
Specification = "https://github.com/CWNApps/openagentontology/blob/main/SPEC.md"

[project.scripts]
openagentontology = "openagentontology.cli:main"
openagentontology-mcp = "openagentontology.mcp_server:main"

[tool.setuptools]
packages = ["openagentontology"]

[tool.setuptools.package-data]
openagentontology = ["py.typed"]

[tool.pytest.ini_options]
# Run from the repo root: `pytest` (no install needed -- conftest puts the package on sys.path).
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
